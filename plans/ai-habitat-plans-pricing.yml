pricing_model: none
cost_to_use:
  software: free (MIT)
  infrastructure: >-
    Borne entirely by the user — a GPU machine or cluster. This is the real cost of adopting Habitat and
    it is not a provider charge.
  datasets: >-
    Scene datasets are licensed separately by their publishers. HM3D, MatterPort3D, Gibson and Replica
    each require agreement to their own terms before download; some are gated behind an academic-use
    form held by the dataset owner, not by Meta.
