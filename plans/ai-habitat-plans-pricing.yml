description: >-
  AI Habitat publishes no plans and no pricing, because there is nothing to price: habitat-sim,
  habitat-lab and habitat-baselines are MIT-licensed software the user installs and runs on their own
  hardware, and there is no hosted API, no account and no metered service. This file records that
  measured zero. It REPLACES a 2026-05-04 bulk-sweep scaffold that asserted free/pro tiers with a
  1,000-request monthly quota — values the provider never published and which do not correspond to
  anything AI Habitat operates.
