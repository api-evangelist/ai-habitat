description: >-
  AI Habitat exposes no network API, so there are no rate limits to publish and none exist. This file
  records that measured zero. It REPLACES a 2026-05-04 bulk-sweep scaffold which asserted X-RateLimit-*
  response headers, a 429 throttle code and a 1,000-request monthly free-tier quota — none of which AI
  Habitat has ever served, because there is no server.
limit_count: 0
