responseCodes: {}
throughput_note: >-
  The performance numbers Habitat does publish are the opposite kind of measurement — a ceiling the
  software achieves rather than one it imposes: 10,000+ FPS multi-process rendering on a single GPU for
  MatterPort3D scenes, and 8,000+ steps/second simulating a Fetch robot in ReplicaCAD, each step being
  one 128x128 RGBD render plus 1/30s of rigid-body dynamics. Source:
  https://github.com/facebookresearch/habitat-sim#readme. These are not rate limits and must not be
  read as quotas.
